    <clipPath id="frame"><rect width="1200" height="1200" rx="28"/></clipPath>
  </defs>
  <g clip-path="url(#frame)">
    <image href="launch-background.jpg" width="1200" height="1200" preserveAspectRatio="xMidYMid slice"/>
    <rect width="1200" height="1200" fill="url(#shade)"/>
    <rect x="52" y="52" width="1096" height="1096" rx="18" fill="none" stroke="#5e7180" stroke-opacity=".5"/>
