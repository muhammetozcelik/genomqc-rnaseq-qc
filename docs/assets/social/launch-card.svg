    <rect x="186" width="170" height="52" rx="26" fill="#f0b429" fill-opacity=".18" stroke="#f0b429"/>
    <circle cx="214" cy="26" r="7" fill="#ffd369"/><text x="234" y="34" font-family="Consolas,monospace" font-size="19" font-weight="700" fill="#ffe7a8">WARN</text>
    <rect x="372" width="170" height="52" rx="26" fill="#e8514a" fill-opacity=".18" stroke="#e8514a"/>
    <circle cx="400" cy="26" r="7" fill="#ff8b85"/><text x="420" y="34" font-family="Consolas,monospace" font-size="19" font-weight="700" fill="#ffc1bd">FAIL</text>
