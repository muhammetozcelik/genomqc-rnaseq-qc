  <text x="162" y="119" font-family="Arial,Helvetica,sans-serif" font-size="28" font-weight="800" fill="#fff">GenomQC</text>
  <text x="86" y="260" font-family="Consolas,monospace" font-size="20" font-weight="700" letter-spacing="3" fill="#68c4ff">RNA-SEQ QUALITY CONTROL</text>
  <text x="82" y="360" font-family="Georgia,serif" font-size="78" font-weight="700" fill="#fff">From QC output</text>
  <text x="82" y="445" font-family="Georgia,serif" font-size="78" font-style="italic" fill="#ef5a34">to a decision.</text>
  <text x="86" y="525" font-family="Arial,Helvetica,sans-serif" font-size="27" fill="#d5e0e7">Turn MultiQC exports into explainable</text>
  <text x="86" y="565" font-family="Arial,Helvetica,sans-serif" font-size="27" fill="#d5e0e7">sample-level PASS / WARN / FAIL reports.</text>
  <g transform="translate(86 655)">
